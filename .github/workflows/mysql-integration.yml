name: MySQL integration

on:
  push:
  pull_request:

jobs:
  mysql-live:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-root-only
          MYSQL_DATABASE: mai_living_world_test
          MYSQL_USER: mlw_test
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MLW_LIVE_MYSQL: "1"
      MLW_MYSQL_HOST: "127.0.0.1"
      MLW_MYSQL_PORT: "3306"
      MLW_MYSQL_USER: "mlw_test"
      MLW_MYSQL_PASSWORD: "ci-test-only"
      MLW_MYSQL_DATABASE: "mai_living_world_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pydantic 'PyMySQL>=1.1,<2.0' 'mcp>=1.28.1,<2' 'jsonschema>=4,<5' 'Pillow>=10,<13' 'imageio-ffmpeg>=0.6,<1'
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_mysql_ledgers_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_growth_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_belief_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_tool_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_social_store.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_research_store.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_companion_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_bond_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_continuity_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_attention_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_activity_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_cognitive_workspace_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_recollection_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_habits_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_followthrough_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_projects_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_shared_reading_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_advice_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_reference_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_repair_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_emotion_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_memory_archive_mysql_live.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_reply_budget_mysql_live.py' -v
      - name: Create isolated backup restore database
        run: |
          python - <<'PY'
          import pymysql
          with pymysql.connect(host='127.0.0.1', user='root', password='ci-test-root-only', autocommit=True) as db:
              with db.cursor() as cur:
                  cur.execute('CREATE DATABASE mlw_backup_test CHARACTER SET utf8mb4')
                  cur.execute("GRANT ALL ON mlw_backup_test.* TO 'mlw_test'@'%'")
          PY
      - name: Verify backup restore against real MySQL
        env:
          MLW_BACKUP_MYSQL_DATABASE: mlw_backup_test
        run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_backup_state.py' -v
      - run: PYTHONPATH="$(dirname "$GITHUB_WORKSPACE")" python -m unittest discover -s tests -p 'test_mysql_schema_comments.py' -v
