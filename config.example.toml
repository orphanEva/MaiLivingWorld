# MaiLivingWorld v0.13.0 · 全字段中文注释配置模板
# 此文件是安全的源码默认配置，不包含私人QQ号或数据库密码。
# MaiBot Runner 默认生成的是 config.toml，不会自动加载本文件；请在 WebUI「原始 TOML」中对照使用。
# 保存前请备份原配置，避免用默认值覆盖当前已测试通过的设置。
# plugin.enabled 是整个插件开关；general.enabled 只控制主动聊天。
# 记忆桥开启时需要容器环境变量 MLW_WEBUI_TOKEN，切勿在 TOML 中直接填写 WebUI 管理密钥。


# ====================================================================
# 00 / 插件设置
# ====================================================================
[plugin]
# 插件全局总开关：false 会连主人识别一并关闭。
enabled = true
# 当前插件配置版本；必须与安装版本一致，不要随意修改。
config_version = "0.13.0"

# ====================================================================
# 10 / 统一心智与唯一主人（沿用 brain_memory 的输入名单）
# ====================================================================
[unified_mind]
# 开启跨窗口统一联想；还需 owner.enabled=true 和绑定唯一 owner.qq。
enabled = false
# observe只统计内部判断，active将适合当前对象的内容用于回复；不增加主动发送。
mode = "observe"
# 每次内部联想的相关记忆上限，来源包括已启用的私人/群聊/公开账本。
recall_limit = 12
# 各来源合计最多取回的候选行数；这不等于数据库物理扫描量。
candidate_limit = 200
# 新的联想周期最短间隔；同轮通用知识复核不等待但另算一次调用。
min_interval_seconds = 30
# 回复/主动联系的联想、表达复核及成长模型共用每日上限；MCP另有调用预算。
max_daily_model_calls = 60
# 每次模型调用超时；一轮至多两次调用，失败不将私人原文直接送入回复。
model_timeout_seconds = 8

# ====================================================================
# 11 / 长期兴趣与性格成长
# ====================================================================
[growth]
# 开启持久学习循环；还需 unified_mind.enabled=true 与唯一主人绑定。
enabled = false
# observe仅验证任务；active更新自身兴趣、观点、知识、问题、性格与短期情绪。
mode = "observe"
# 新学习任务最短间隔秒数；重启保留任务与计时，失败按持久退避重试。
interval_seconds = 3600

# ====================================================================
# 07 / 数据持久化（SQLite 或 MySQL）
# ====================================================================
[storage]
# sqlite=独立本地文件；mysql=专用数据库；切换后要重载，不自动迁移旧数据。
backend = "sqlite"
# MySQL 主机名/IP；同一个 Docker 网络可填容器服务名
mysql_host = "mysql"
# MySQL 连接端口
mysql_port = 3306
# MySQL 用户，建议仅授予专用数据库权限
mysql_user = "mai_living_world"
# MySQL密码，仅在MySQL模式生效；不要提交GitHub，不要放公开日志。
mysql_password = ""
# MySQL 数据库（需先创建）；数据表由插件自动初始化
mysql_database = "mai_living_world"
# MySQL表名前缀，避免和其他业务数据表冲突。
mysql_table_prefix = "mlw_"
# MySQL 连接超时（秒）
mysql_connect_timeout = 5
# 仅用于临时排查：MyBatis 风格 SQL 模板、脱敏参数类型、影响行数和耗时；默认关闭。
# 绝不打印具体参数值（包括 QQ 号、私聊正文和数据库密码）。
sql_debug = false

# ====================================================================
# 08 / 经验与行为反馈（绑定主人 QQ 的真实私聊；默认关闭）
# ====================================================================
[experience]
# 必须同时 owner.enabled=true 且填写 owner.qq 才有作用。
enabled = false
# observe 仅记账；active 对明确负反馈暂缓同类选题，不能增加主动联系次数。
mode = "observe"
# 只分析成功主动发送后24小时内、本人有消息ID的可信回复。
feedback_hours = 24
# active 模式下明确不感兴趣则该类主动选题暂缓12小时。
negative_pause_hours = 12

# ====================================================================
# 09 / 记忆与认知闭环（默认关闭，各阶段分别勾选）
# ====================================================================
[brain_memory]
# 新版事件/事实/目标/元认知模块总开关；不取代旧 mind 与 A_Memorix。
enabled = false
# observe 只记录；active 向当前经核验的私聊或群聊注入已生效事实/目标。
mode = "observe"
# 是否后台限频调用 MaiBot 已配置模型整理当前作用域的真实 QQ 消息。
auto_reflect = false
# 脑记忆启用时是否开启分钟级轻量事实/目标进展更新；不触发主动发言。
quick_update = true
# 快速更新的最小冷却分钟数，不影响原有深度反思的小时级冷却。
quick_interval_minutes = 5
# 绑定主人识别启用后，自动纳入其私聊；其他用户必须明确配置私聊白名单。
include_owner = true
# 额外允许采集私聊记忆的 QQ 用户 ID；来源会保留，统一心智内部可跨入口联想。
private_users = []
# 允许采集群聊记忆的群号；群内容不自动公开，统一心智按相关性读取并判断表达。
group_ids = []
# 模块一：提炼带时间、行为人、证据哈希的情景事件。
enable_events = false
# 模块二：提炼用户亲自声明的事实，重复支持后激活，矛盾须审核。
enable_facts = false
# 模块三：维护未完成目标和下一步计划，绝不直接调用外部工具。
enable_goals = false
# 模块四：仅在当事人新消息有证据时记录目标完成或放弃。
enable_progress = false
# 模块五：保存短篇复盘摘要，不保留链式推理。
enable_metacognition = false
# 同一私聊或群作用域两次反思的最小时间间隔（小时）。
interval_hours = 12
# 进行一次反思最少需要的可信非重复文本消息条数。
min_messages = 4
# 单次反思最多向 Host 读取的当前会话消息数。
history_limit = 40
# 每次后台检查最多处理的会话范围，防止模型调用激增。
max_scopes_per_check = 2
# 单个会话范围最多保留多少条情景事件；不会删除已提取事实和目标。
event_limit = 200

# ====================================================================
# 01 / 基础与安全
# ====================================================================
[general]
# 主动聊天调度开关；探索、公开认知和主人识别由各自 enabled 控制。
enabled = false
# true=只模拟选题并记录日志，不发送主动QQ消息、不写外部记忆；false=正式主动唤醒。
dry_run = true
# 免打扰与日配额时区
timezone = "Asia/Shanghai"
# 内部检查频率，不是主动聊天频率
tick_seconds = 60
# 容器刚启动时等待宿主完成加载
startup_delay_seconds = 25

# ====================================================================
# 02 / 允许联系的 QQ
# ====================================================================
[audience]
# 允许主动私聊的QQ号，如 ['12345678']；必须有既存私聊会话
private_users = []
# 允许主动发言的群号，空列表表示不向任何群主动发言
group_ids = []
# 私聊静默至少多久才考虑发起
private_min_idle_minutes = 90
# 群聊静默至少多久才考虑带话题出来
group_min_idle_minutes = 35
# 每隔多少分钟检查活跃度，不代表每次都调用模型
check_interval_minutes = 25
# 相同目标两次选题决策最少间隔分钟数，允许5～1440；不能填1。
min_decision_gap_minutes = 120
# 同一目标两次确认发送之间的最小间隔小时数（0～168）；stop 不算发送。
min_gap_hours = 6.0
# 每目标每天最多多少轮确认发送（0～30）；Planner 选择 stop 不消耗额度。
max_daily_per_target = 2
# 两次主动唤醒尝试的最短间隔分钟数（5～1440），控制 Planner 调用频率。
min_attempt_gap_minutes = 30
# 每目标每天最多唤醒尝试数（0～40），包括 stop/失败，防止反复刷模型 Token。
max_daily_attempts_per_target = 8
# 第一次 stop 后退避分钟数（5～1440）；连续 stop 翻倍。
stop_backoff_base_minutes = 45
# 连续 stop 退避上限（15～10080），实际不会短于基础值。
stop_backoff_max_minutes = 240
# 免打扰开始，例如 23:00
quiet_start = "23:00"
# 免打扰结束时间，24小时制；与 quiet_start 相同表示禁用免打扰。
quiet_end = "09:00"
# 没有值得分享的真实见闻时，允许模型判断是否延续旧话题
history_gate = true
# 只读取当前聊天流的最近消息；不跨群/私聊混用
recent_message_limit = 25

# ====================================================================
# 03 / 主人识别（QQ 可信身份）
# ====================================================================
[owner]
# 仅靠平台提供的真实发送者QQ号识别主人；不增加管理员或命令权限。
enabled = false
# 主人真实QQ号，必须是数字字符串；不要提交到GitHub公开仓库。
qq = ""
# 聊天时使用的关系称呼
title = "主人"
# 群聊中主人本人发消息时注入本轮身份提示
recognize_in_groups = true
# 在与主人 QQ 的私聊中注入本轮身份提示
recognize_in_private = true
# 可选：将主人加入主动私聊白名单；默认不自动联系主人
add_to_private_targets = false
# 主人专属关系风格；关闭后仍识别主人，但不添加亲疏表达指引
relationship_enabled = true
# banter=损友亲近 / gentle=温柔偏心 / tsundere=嘴硬心软 / custom=自定义。
relationship_mode = "banter"
# 主人的私聊自定义风格；非空时覆盖对应预设，最多使用前1600字。
private_template = ""
# 主人的群聊自定义风格；非空时覆盖对应预设，禁止填写私聊秘密。
group_template = ""

# ====================================================================
# 04 / 外部世界（只读）
# ====================================================================
[explorer]
# 外部探索开关：只有打开后才联网抓取
enabled = false
# 外部资料抓取间隔；与主动联系检查周期分开
scan_interval_minutes = 90
# 读取B站公开热门视频标题/简介，不需要账号，也不观看视频
bilibili_popular_enabled = true
# RSS/Atom订阅URL数组；设置为 [] 可禁用RSS，网络不可达时建议先关闭。
rss_feed_urls = ["https://rsshub.app/xiaoheihe/news"]
# 仅允许访问白名单HTTPS主机，不接受重定向
rss_allowed_hosts = ["rsshub.app"]
# 资讯兴趣关键词，只是弱偏好，不是严格白名单。
interests = ["游戏", "动漫", "科技", "AI"]
# 禁止主动分享的关键词；在标题和摘要中匹配
blocked_words = []
# 此项为内部参数，请参阅源码
max_items_per_source = 20
# 过旧资讯不主动分享
max_age_hours = 168
# 此项为内部参数，请参阅源码
candidate_count = 8
# 此项为内部参数，请参阅源码
request_timeout_seconds = 12

# ====================================================================
# 05 / 自主决策
# ====================================================================
[brain]
# 模型任务名，使用你已经配置的MaiBot模型
model_task = "utils"
# true由模型选择素材；false按兴趣排序，不代表强制发送。
use_llm_selection = true
# 唤醒优先级 low / normal / high；建议保持 low
proactive_priority = "low"

# ====================================================================
# 06 / 长期经历（A_Memorix）
# ====================================================================
# -----------------------------------------------------------------------------
# 私聊来源的反思账本（统一心智开启后参与跨入口内部联想）
# -----------------------------------------------------------------------------
[mind]
# 是否启用私人观察账本；默认关闭，不会自动保存或分析私人聊天。
enabled = false
# 是否定期调用模型反思最近与绑定主人的私聊；打开后会消耗模型Token。
auto_reflect = false
# observe=只记录和审查、不影响实际回复；active=只注入有可信消息来源的有效笔记。
mode = "observe"
# 同一主人最少隔多少小时才再次反思（1～168），没有新聊天内容则跳过。
interval_hours = 12
# 每次取最近多少条私聊消息做复盘（8～80）；不读取群聊。
history_limit = 40
# 最近私聊少于多少条时不反思（4～80）；防止从几句寒暄推导长期关系。
min_history_messages = 8
# 模型输出的观察最低置信度（0.5～1.0），低于阈值不入库。
min_confidence = 0.8
# 独立本地笔记最多保存多少条（4～40）；过多笔记自动裁剪。
note_limit = 20


# ====================================================================
# 07 / 有限自主认知（只处理公开资讯）
# ====================================================================
[cognition]
# 是否启用独立的公开认知账本 cognition.sqlite3；默认关闭，不读取QQ私聊。
enabled = false
# 是否定期用当前 brain.model_task 模型整理公开标题、简介；会消耗模型Token。
auto_think = false
# observe=只做观察记录；active=公开关注主题作为选题弱偏好，不增加主动聊天次数。
mode = "observe"
# 两次思考尝试最小间隔小时数（1～168），模型失败时也会限频。
interval_hours = 6
# 每天最多调用几次公开认知模型（0～12），0表示禁止调用。
max_daily_cycles = 2
# 一轮最多分析多少条未处理的公开资讯（1～20），仅标题和简介。
max_public_candidates = 6
# 最多同时维护多少个未完成的公开问题（1～30），达到上限后停止新增。
max_open_questions = 8
# 每轮最多创建多少个待核验的新问题（1～5），可以为0个。
max_new_per_cycle = 2

[memory]
# 是否允许提交公共外部见闻到记忆桥；还需将 backend 改成 webui_import。
enabled = false
# off=关闭；webui_import=通过MaiBot WebUI导入任务写入A_Memorix，需要管理员Token环境变量。
backend = "off"
# MaiBot WebUI在本机的端口；仅访问127.0.0.1，必须能与插件共享网络命名空间。
webui_port = 8001
# 每条记忆导入任务等待完成的最长秒数；超时不算成功。
import_max_wait_seconds = 45
# 旧版兼容字段；v0.6.0 的 WebUI 导入桥不使用这个值，写入 global 公共作用域。
chat_id = "living_world_explore"

# ====================================================================
# 12 / MCP 工具与自主查阅
# ====================================================================
[mcp]
# 连接 cap / Pixiv MCP；需统一心智与可信主人绑定，服务独立运行。
enabled = false
# 默认只有可信主人能调用；关闭后其他授权用户也仅能读取固定作品元数据。
owner_only = true
# 允许采集名单内群聊读取固定作品元数据；管理、写入与任务详情仍只在主人私聊。
allow_group_reads = false
# 允许主人私聊创建归档、下载或媒体任务；不自动授权账户变更或文件传输。
allow_writes = false
# 另行允许主人私聊进行持续订阅、远端收藏/关注和账户迁移。
allow_account_actions = false
# 另行允许主人私聊使用 cap 已配置的文件发布/接收服务。
allow_file_transfer = false
# 只保存成功返回的作品元数据/小说片段作为带来源观察，不保存任务路径、凭据或签名链接。
remember_results = true
# 所有 MCP 工具及图片读取共用的持久每日调用上限；失败计数。
max_daily_calls = 100
# 单次 MCP 请求超时；写入结果未知时不自动重试。
timeout_seconds = 30
# 解析后 MCP 结果大小上限；只连接管理员配置的可信服务。
max_response_bytes = 262144
# 未解问题可驱动 Pixiv 本地资料库查询，只读且不自动下载。
research_enabled = false
# 问题查阅全局最短间隔，重启保留游标与失败退避。
research_interval_seconds = 3600
# 每天自主查阅轮数上限，每轮最多检索和读取一个结果各一次。
research_daily_limit = 6
# 允许主人私聊将 Pixiv 缓存图片交给模型观察；需本进程有后端 URL/API Key 环境变量。
media_enabled = false
# 单张图片读取字节上限，禁止跨站重定向和任意文件路径。
max_media_bytes = 8388608

# ====================================================================
# 13 / cap MCP 连接
# ====================================================================
[mcp_cap]
# 启用 cap 的独立 MCP 连接。
enabled = false
# Docker 推荐受认证 HTTP 网关；同环境也可用 stdio。
transport = "http"
# HTTP MCP 网关地址，只由管理员配置。
url = "http://cap-mcp:8000/mcp"
# HTTP Bearer 密钥所在环境变量名，不填密钥正文。
token_env = "MLW_CAP_MCP_TOKEN"
# stdio 专用：MCP 独立 Python 可执行文件绝对路径。
command = ""
# stdio 专用：启动参数数组，连接根 mcp_server.py，不使用 ncatbot 的 MCP。
args = []
# stdio 专用：cap 源码工作目录。
cwd = ""
# stdio 专用：仅传递列出的宿主环境变量，任务数据库由插件独立指定。
env_names = ["JM_CONFIG_PATH", "JM_FILE_SERVER_URL", "JM_FILE_API_TOKEN"]

# ====================================================================
# 14 / Pixiv MCP 连接
# ====================================================================
[mcp_pixiv]
# 启用 Pixiv 缓存后端的独立 MCP 连接。
enabled = false
# Docker 推荐受认证 HTTP 网关；同环境也可用 stdio。
transport = "http"
# HTTP MCP 网关地址，不能填写普通后端 REST 地址。
url = "http://pixiv-mcp:8000/mcp"
# HTTP Bearer 密钥所在环境变量名，不填密钥正文。
token_env = "MLW_PIXIV_MCP_TOKEN"
# stdio 专用：Pixiv MCP 的 Python 3.12+ 独立解释器。
command = ""
# stdio 专用：Pixiv MCP 启动参数。
args = ["-m", "app.mcp"]
# stdio 专用：pixiv-cache-backend 源码工作目录。
cwd = ""
# stdio 专用：传给子进程的环境变量名；不自动读取 .env。
env_names = ["PIXIV_MCP_BACKEND_URL", "PIXIV_MCP_API_KEY"]
